name: Deploy to Production

# Un push a master corre los tests y nada más. El despliegue lo dispara el tag
# de la versión, que es la señal que el proyecto ya usa para marcar un release
# (ver el flujo de versionamiento en CLAUDE.md). Así `git push origin master`
# deja de ser una operación irreversible: no migra producción por sí solo.
#
# Para desplegar: crear y empujar el tag (git push origin master vX.Y.Z).
# Para redesplegar o volver a una versión anterior: workflow_dispatch con el tag.
# Ojo: revertir el código NO revierte las migraciones ya aplicadas.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag a desplegar (ej. v1.12.0)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd, exif, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Run test suite
        run: php artisan test

  deploy:
    needs: test
    # Sólo en tag de versión o disparo manual. Un push a master no llega aquí.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # El pipeline no puede migrar sin un respaldo fresco: si este paso falla,
      # el job se detiene y el despliegue nunca corre.
      - name: Backup production database
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -ls' << 'EOF'
          set -euo pipefail

          APP_DIR="$HOME/factory.corneliodev.com"
          BACKUP_DIR="$HOME/db-backups"
          mkdir -p "$BACKUP_DIR"

          # Las credenciales salen del .env del servidor: no hacen falta secrets nuevos.
          read_env() {
            sed -n "s/^$1=//p" "$APP_DIR/.env" | head -1 \
              | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"
          }

          DB_NAME="$(read_env DB_DATABASE)"
          DB_USER="$(read_env DB_USERNAME)"
          DB_PASS="$(read_env DB_PASSWORD)"

          if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ]; then
            echo "ERROR: no se pudieron leer las credenciales de $APP_DIR/.env"
            exit 1
          fi

          # La contrasena va en un archivo temporal, no en la linea de comandos,
          # donde seria visible para cualquier proceso del servidor compartido.
          CNF="$(mktemp)"
          trap 'rm -f "$CNF"' EXIT
          chmod 600 "$CNF"
          printf '[client]\nuser=%s\npassword=%s\n' "$DB_USER" "$DB_PASS" > "$CNF"

          FILE="$BACKUP_DIR/${DB_NAME}_$(date +%Y%m%d_%H%M%S).sql.gz"

          # Se escribe como .part y solo se renombra al terminar bien, para que un
          # volcado interrumpido no deje un archivo que parezca un respaldo valido.
          trap 'rm -f "$CNF" "$FILE.part"' EXIT

          mysqldump --defaults-extra-file="$CNF" \
            --single-transaction --quick --routines --events "$DB_NAME" | gzip > "$FILE.part"

          SIZE="$(wc -c < "$FILE.part")"
          if [ "$SIZE" -lt 10240 ]; then
            echo "ERROR: el respaldo pesa $SIZE bytes. Demasiado pequeno para ser valido."
            exit 1
          fi

          mv "$FILE.part" "$FILE"
          echo "Respaldo OK: $FILE ($SIZE bytes)"

          find "$BACKUP_DIR" -name '*.sql.gz' -type f -mtime +30 -delete
          EOF

      - name: Upload build assets
        run: |
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -r \
            public/build \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/factory.corneliodev.com/public/

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "DEPLOY_REF='${DEPLOY_REF}' bash -ls" << 'EOF'
          set -euo pipefail
          cd ~/factory.corneliodev.com

          # Preflight: resolver las herramientas ANTES de mover el repo.
          #
          # Esta es la lección de v1.14.0: el checkout del tag corrió primero y
          # `composer install` falló después con "command not found", dejando el
          # sitio con código nuevo sobre el esquema viejo — caído, y sin haber
          # migrado. Si falta una herramienta, ahora el despliegue se detiene con
          # producción intacta en la versión anterior.
          PHP_BIN="$(command -v php || true)"
          if [ -z "$PHP_BIN" ]; then
            echo "ERROR: no se encontró php. PATH=$PATH"
            exit 1
          fi

          COMPOSER_CMD="$(command -v composer || true)"
          if [ -z "$COMPOSER_CMD" ]; then
            for candidate in /opt/cpanel/composer/bin/composer "$HOME/bin/composer" /usr/local/bin/composer; do
              if [ -x "$candidate" ]; then COMPOSER_CMD="$candidate"; break; fi
            done
          fi
          if [ -z "$COMPOSER_CMD" ] && [ -f "$HOME/composer.phar" ]; then
            COMPOSER_CMD="$PHP_BIN $HOME/composer.phar"
          fi
          if [ -z "$COMPOSER_CMD" ]; then
            echo "ERROR: no se encontró composer ni en el PATH ni en las rutas habituales."
            echo "PATH=$PATH"
            exit 1
          fi

          echo "php:      $PHP_BIN"
          echo "composer: $COMPOSER_CMD"

          # Despliega el tag exacto, no "lo que haya en master ahora mismo".
          # Deja el repo en HEAD desacoplado: para ver en que version esta el
          # servidor, `git describe --tags`.
          git fetch --tags --force --prune origin
          git checkout --force "$DEPLOY_REF"
          $COMPOSER_CMD install --no-dev --optimize-autoloader --no-interaction
          "$PHP_BIN" artisan migrate --force
          "$PHP_BIN" artisan shield:generate --all --panel=admin
          "$PHP_BIN" artisan db:seed --class=NotificationSettingsSeeder --force
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan optimize
          # Reset OPcache del pool FPM (CLI no lo alcanza — son instancias separadas)
          echo '<?php opcache_reset(); echo "ok"; @unlink(__FILE__);' > public/_opcache_reset.php
          curl -fsS https://factory.corneliodev.com/_opcache_reset.php || echo "warn: opcache reset via web falló"
          EOF
