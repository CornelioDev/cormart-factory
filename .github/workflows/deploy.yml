name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build Vite assets
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build assets
        run: |
          scp -P ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -r \
            public/build \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/factory.corneliodev.com/public/

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ~/factory.corneliodev.com
          git pull origin master
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          # Reset OPcache del pool FPM (CLI no lo alcanza — son instancias separadas)
          echo '<?php opcache_reset(); echo "ok"; @unlink(__FILE__);' > public/_opcache_reset.php
          curl -fsS https://factory.corneliodev.com/_opcache_reset.php || echo "warn: opcache reset via web falló"
          EOF
